<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Launcher — ดาวน์โหลด</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0e1116;color:#e8ecf3;font:16px system-ui,"Noto Sans Thai",sans-serif;text-align:center}
  main{max-width:460px;padding:24px}
  h1{font-size:32px;margin:0 0 8px} p{color:#8b94a7}
  a.btn{display:inline-block;margin-top:20px;padding:16px 34px;border-radius:14px;background:#6c8cff;color:#fff;font-weight:700;text-decoration:none}
  a.btn.off{opacity:.5;pointer-events:none} small{display:block;margin-top:14px;color:#8b94a7}
</style>
</head>
<body><main>
  <h1>Nova Launcher</h1>
  <p>โหลดครั้งเดียว ติดตั้งในไม่กี่วินาที หลังจากนั้นอัปเดตเองอัตโนมัติ</p>
  <a id="dl" class="btn off" href="#">กำลังโหลด...</a>
  <small id="info"></small>
</main>
<script>
  const REPO = "OWNER/REPO";   // ← แก้เป็น GitHub repo ของคุณ
  fetch(`https://api.github.com/repos/${REPO}/releases/latest`)
    .then(r => r.json())
    .then(rel => {
      const a = rel.assets.find(x => x.name.endsWith("-setup.exe"));
      dl.href = a.browser_download_url; dl.textContent = "ดาวน์โหลดสำหรับ Windows"; dl.classList.remove("off");
      info.textContent = `${rel.tag_name} · ${(a.size / 1048576).toFixed(1)} MB`;
    })
    .catch(() => { dl.textContent = "เปิดหน้า Releases"; dl.href = `https://github.com/${REPO}/releases/latest`; dl.classList.remove("off"); });
</script>
</body></html>
